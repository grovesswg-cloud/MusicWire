name: MusicWire Publisher

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
    - cron: '0 12 * * *'
    - cron: '0 15 * * *'
    - cron: '0 18 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      content_type:
        description: 'Content type to publish'
        required: false
        default: 'news'
        type: choice
        options: [news, feature, review, classic-review]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Determine content type
        id: ctype
        run: |
          HOUR=$(date -u +%H)
          INPUT="${{ github.event.inputs.content_type }}"
          if [ -n "$INPUT" ]; then
            echo "type=$INPUT" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "09" ] || [ "$HOUR" = "18" ]; then
            echo "type=feature" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "12" ] || [ "$HOUR" = "21" ]; then
            echo "type=review" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "15" ]; then
            echo "type=classic-review" >> $GITHUB_OUTPUT
          else
            echo "type=news" >> $GITHUB_OUTPUT
          fi

      - name: Publish
        working-directory: automation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python scheduler.py --run-now --type ${{ steps.ctype.outputs.type }}

      - name: Commit and push
        run: |
          git config user.name "MusicWire Bot"
          git config user.email "bot@musicwire.com"
          git add site/articles/ site/api/
          git diff --staged --quiet || git commit -m "publish: $(date -u '+%Y-%m-%d %H:%M UTC') [${{ steps.ctype.outputs.type }}]"
          git push
